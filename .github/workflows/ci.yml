name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile installer and validators
        run: python -m py_compile scripts/install.py scripts/build_inventory.py scripts/validate.py

      - name: Validate repository
        run: python scripts/validate.py

      - name: Dry-run complete installer
        run: python scripts/install.py --profile all --dry-run

      - name: Run unit and installation tests
        run: python -m unittest discover -s tests -v
